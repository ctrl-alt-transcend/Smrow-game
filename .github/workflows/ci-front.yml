name: CI-front

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main", develop]

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ./app/frontend/package-lock.json
      - name: Install dependencies
        working-directory: app/frontend
        run: npm ci
      - name: Check Format
        working-directory: app/frontend
        run: npm run format

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: action/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          chache: "npm"
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install dependencies
        working-directory: app/frontend
        run: npm i

      - name: Lint Code
        working-directory: app/fronted
        run: npm run lint

  type-check:
    runs-on: ubuntu-latest

    steps:
      - uses: action/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          chache: "npm"
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install dependencies
        working-directory: app/frontend
        run: npm i

      - name: Type check
        run: npm run type-check

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: action/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          chache: "npm"
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install dependencies
        working-directory: app/frontend
        run: npm i

      - name: Run tests
        run: npm test  -- --pool=threads --maxWorkers=1

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4

        with:
          name: client-build
          path: app/frontend/dist/
          retention-days: 7
