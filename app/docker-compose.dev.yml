## Container delcaration exemple ##
#
# container-id
#   build:
#     context: path/to/dockerfile/folder
#   container_name:
#   ports:
#     - xxxx:xxxx
#   volumes:
#     - ./path/machine/folder:/path/docker/folder
#   restart: unless-stopped
#   env_file: ".env_filename"
#   networks:
#     - networks-name
#   secrets:
#     - sercrets_service_name
#

name: ft-catan #temporary
services:

  nestjs:
    build:
      context: ./backend
      target: dev
    container_name: nestjs
    ports:
      - 3000:3000
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          ignore:
            - node_modules/
            - dist/
            - .git/
            - "*.log"
        - action: rebuild
          path: ./backend/package.json
    env_file:
      .env
    networks:
      - ft-network

  postgres:
    image: postgres:18
    container_name: postgres
    env_file:
      - .env
    #using the .env file directly in the compose to set user
    volumes:
      - postgres-data:/var/lib/postgresql/
    ports:
      - "5432:5432"
    networks:
      - ft-network
    restart: unless-stopped



# --- Volumes --- #

volumes:
  postgres-data:

# --- Networks --- #

networks:
  ft-network:

# --- Secrets --- #
