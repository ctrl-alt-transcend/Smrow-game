## Container delcaration exemple ##
#
# container-id
#   build:
#     context: path/to/dockerfile/folder
#   container_name:
#   ports:
#     - xxxx:xxxx
#   volumes:
#     - ./path/machine/folder:/path/docker/folder
#   restart: unless-stopped
#   env_file: ".env_filename"
#   networks:
#     - networks-name
#   secrets:
#     - sercrets_service_name
#

name: ft-catan #temporary
services:

  # -- Backend -- #

  nestjs:
    build:
      context: ./backend
      target: dev
      additional_contexts:
        shared: ./shared
    container_name: nestjs
    ports:
      - 3000:3000
      - 3001:3001
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          ignore:
            - node_modules/
            - dist/
            - .git/
            - "*.log"
            - prisma/migrations

          ## shared types sync
        - action: sync
          path: ./shared
          target: /app/shared

        - action: rebuild
          path: ./backend/package.json
        - action: rebuild
          path: ./backend/prisma/schema.prisma
        - action: rebuild
          path: ./backend/prisma/migrations



    env_file:
      .env
    networks:
      - ft-network

  postgres:
    image: postgres:18
    container_name: postgres
    env_file:
      - .env
    #using the .env file directly in the compose to set user
    volumes:
      - postgres-data:/var/lib/postgresql/
    ports:
      - "5432:5432"
    networks:
      - ft-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5


  # -- Frontend -- #

  frontend:
    build:
      context: ./frontend
      target: dev
      additional_contexts:
        shared: ./shared
    container_name: frontend
    ports:
      - 5173:5173
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          ignore:
            - node_modules/
            - dist/
            - .git/
            - "*.log"

        - action: sync
          path: ./shared
          target: /app/shared

        - action: rebuild
          path: ./frontend/package.json

    networks:
      - ft-network


# --- Volumes --- #

volumes:
  postgres-data:

# --- Networks --- #

networks:
  ft-network:

# --- Secrets --- #
